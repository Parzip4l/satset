services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: satset-app
    container_name: satset-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - satset-network
    depends_on:
      - db
      - redis

  it-worker:
    image: satset-app
    restart: unless-stopped
    working_dir: /var/www
    command: ["php", "artisan", "queue:work", "it_database", "--queue=it", "--sleep=2", "--tries=5", "--timeout=60", "--max-time=3600"]
    environment:
      QUEUE_CONNECTION: it_database
      QUEUE_FAILED_TABLE: it_queue_failed_jobs
      IT_RUNTIME_COMPONENT: worker
    volumes:
      - ./:/var/www
    networks:
      - satset-network
    stop_grace_period: 70s
    healthcheck:
      test: ["CMD", "php", "artisan", "satset:it-health", "--component=worker", "--max-age=180"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  it-scheduler:
    image: satset-app
    restart: unless-stopped
    working_dir: /var/www
    command: ["php", "artisan", "schedule:work"]
    environment:
      QUEUE_CONNECTION: it_database
      QUEUE_FAILED_TABLE: it_queue_failed_jobs
      IT_RUNTIME_COMPONENT: scheduler
    volumes:
      - ./:/var/www
    networks:
      - satset-network
    healthcheck:
      test: ["CMD", "php", "artisan", "satset:it-health", "--component=scheduler", "--max-age=180"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  nginx:
    image: nginx:alpine
    container_name: satset-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - satset-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: satset-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - satset-network
  adminer:  
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    

  redis:
    image: redis:alpine
    container_name: satset-redis
    networks:
      - satset-network

networks:
  satset-network:
    driver: bridge



volumes:
  dbdata: